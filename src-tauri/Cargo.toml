[package]
name = "aikf"
version = "0.1.0"
description = "樱追番 · Anich — Tauri + Vue3 anime tracking app"
authors = ["Ming"]
edition = "2021"

[lib]
name = "aikf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 注意：绝不能把 custom-protocol 写进这里的 features！
# tauri/custom-protocol 会向前转发到 tauri-macros/custom-protocol，使宏内
# dev 标志恒为 false → dev 也强制校验/嵌入 dist → 无 dist 时 pnpm tauri dev
# 直接 panic（本包 v3.1 及之前的病根）。正确做法是只保留下方 [features] 段。
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 网络优化：gzip/brotli 响应压缩（API 返回的 protobuf/JSON 体积大幅减小，
# reqwest 自动附带 Accept-Encoding 并透明解压）；http2 启用 ALPN 多路复用。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "http2"] }
# net + io-util：OAuth 本地回调服务器的 TcpListener / AsyncRead / AsyncWrite
tokio = { version = "1", features = ["time", "rt", "sync", "macros", "net", "io-util"] }
# 完整日志系统：文件（exe目录\log）+ stdout，前端 console 经 attachConsole 汇聚写入
log = "0.4"
tauri-plugin-log = "2"
# 单实例：aikf:// 协议回调拉起新进程时，把 URL 转交给已运行实例后退出
tauri-plugin-single-instance = "2"
# 日志文件名时间戳（yyyy-MM-dd HH-mm.log）
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
# 运行时注册 aikf:// URL 协议（HKCU，便携版免安装也可用）
winreg = "0.52"

[features]
default = []
# 由 `pnpm tauri build` 在生产构建时自动启用：把 ../dist 嵌入产物。
# dev（pnpm tauri dev）不启用它 → 编译期跳过 dist 校验，页面走 vite dev server。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = "z"
strip = true
