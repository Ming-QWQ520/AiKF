name: Build AiKF (Windows)

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref so we don't pile up jobs.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN needs write permission on contents so the workflow
# can create/upload artifacts (and optionally create a release later).
permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────────
  # Frontend-only build: type-check (vue-tsc) + Vite production bundle.
  # Runs on every push & PR; cheap and fast.
  # ───────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (Vue + Vite)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js 20 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Type check (vue-tsc)
        run: pnpm exec vue-tsc --noEmit

      - name: 🏗️ Build with Vite
        run: pnpm run build

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aikf-frontend-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────
  # Tauri Windows build: produces .msi / .exe installers.
  # ───────────────────────────────────────────────────────────────
  build-tauri-windows:
    name: Build Tauri (Windows x64)
    needs: build-frontend
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js 20 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: 🦀 Setup Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 💾 Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Tauri app (Windows)
        run: pnpm tauri build --target x86_64-pc-windows-msvc
        env:
          # Suppress WebView2 downloader prompt on headless runners
          WEBVIEW2_DOWNLOAD_URL: https://go.microsoft.com/fwlink/p/?LinkId=2124703

      - name: 📤 Upload MSI installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: aikf-windows-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: aikf-windows-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn
