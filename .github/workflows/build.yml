name: Build AiKF (Windows)

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref so we don't pile up jobs.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN needs write permission on contents to upload artifacts.
permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────────
  # Frontend-only build: type-check (vue-tsc) + Vite production bundle.
  # Runs on every push & PR; cheap and fast.
  # ───────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (Vue + Vite)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js 20 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Type check (vue-tsc)
        run: pnpm exec vue-tsc --noEmit

      - name: 🏗️ Build with Vite
        run: pnpm run build

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aikf-frontend-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────
  # Tauri Windows portable build: produces just the .exe + supporting
  # files (no MSI / NSIS installer), then zips them into a portable
  # archive the user can extract and run directly.
  # ───────────────────────────────────────────────────────────────
  build-tauri-windows:
    name: Build Tauri (Windows Portable)
    needs: build-frontend
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js 20 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: 🦀 Setup Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 💾 Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64-portable

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Tauri app (no installer, portable exe only)
        # --no-bundle skips MSI / NSIS installer generation entirely.
        # The compiled .exe + any sidecar DLLs land directly under the
        # release/ directory.
        run: pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc

      - name: 📦 Create portable zip archive
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $stageDir = "aikf-windows-portable"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          # Copy the main executable (name comes from tauri.conf.json productName)
          Copy-Item -Path "$releaseDir/AiKF.exe" -Destination "$stageDir/" -ErrorAction Stop

          # Copy any companion DLLs (WebView2Loader.dll, sidecar DLLs, etc.)
          Get-ChildItem -Path $releaseDir -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination "$stageDir/" }

          # Copy resources/ if present (sidecar resources referenced by tauri.conf.json)
          if (Test-Path "$releaseDir/resources") {
            Copy-Item -Path "$releaseDir/resources" -Destination "$stageDir/" -Recurse
          }

          # Write a brief README so users know how to run it
          @"
          # AiKF · 爱看番 (Portable Build)

          直接双击 ``AiKF.exe`` 即可运行，无需安装。

          - 系统要求：Windows 10 1803+ / Windows 11 (已内置 WebView2 Runtime)
          - 若运行报错提示缺少 WebView2，请从微软官网下载安装：
            https://developer.microsoft.com/microsoft-edge/webview2/

          Build SHA: ${{ github.sha }}
          Build Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss zzz')
          "@ | Out-File -FilePath "$stageDir/README.txt" -Encoding utf8

          # Compress the staged folder into a single zip
          Compress-Archive -Path "$stageDir/*" -DestinationPath "aikf-windows-portable.zip" -CompressionLevel Optimal
          Write-Host "✅ Portable zip created: aikf-windows-portable.zip"
          Get-ChildItem -Path "aikf-windows-portable.zip" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}

      - name: 📤 Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: aikf-windows-portable
          path: aikf-windows-portable.zip
          retention-days: 30
          if-no-files-found: error
