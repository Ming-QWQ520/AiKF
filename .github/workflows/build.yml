name: Build AiKF

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref so we don't pile up jobs.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────
  # Frontend-only build: type-check (vue-tsc) + Vite production bundle.
  # Runs on every push & PR; cheap and fast.
  # ───────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (Vue + Vite)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js 20 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Type check (vue-tsc)
        run: pnpm exec vue-tsc --noEmit

      - name: 🏗️ Build with Vite
        run: pnpm run build

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aikf-frontend-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────
  # Full Tauri build: produces installers (.deb/.rpm/.msi/.dmg).
  # Only triggered on push to main/master or manual dispatch.
  # ───────────────────────────────────────────────────────────────
  build-tauri:
    name: Build Tauri (${{ matrix.label }})
    needs: build-frontend
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js 20 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 💾 Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🐧 Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: 🏗️ Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ci-build-${{ github.sha }}
          releaseName: "AiKF CI Build ${{ github.sha }}"
          releaseBody: "Automated build from commit ${{ github.sha }}"
          releaseDraft: true
          prerelease: true
          args: --target ${{ matrix.target }}

      - name: 📤 Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: aikf-tauri-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: aikf-tauri-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: aikf-tauri-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          retention-days: 30
          if-no-files-found: warn
